# Baut das Multi-Arch-Image und veröffentlicht es auf ghcr.io.
#
# Ein Release-Tag vX.Y.Z bringt die Tags latest und X.Y.Z. Den Bau startet release.yml nach dem Setzen des Tags
# (workflow_dispatch auf dem Tag), ein von Hand gepushtes Tag startet ihn ebenso. Ein Bau von Hand auf einem Branch
# veröffentlicht nur das Tag aus BRANCH_IMAGE_TAG und lässt latest und die Versionsnummern unberührt.
name: Container image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/oracle-sniper
  BRANCH_IMAGE_TAG: ${{ vars.BRANCH_IMAGE_TAG || 'edge' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          set -euo pipefail
          for f in bin/oracle-sniper bin/oci-api.sh bin/next-version bin/base-version bin/write-version docker/entrypoint.sh install.sh; do
            bash -n "$f" && echo "ok  $f"
          done

      # Nothing is compiled in this image -- it is Alpine plus shell scripts --
      # so emulation costs nothing and one job covers both architectures.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION="\(.*\)"/\1/p' bin/oracle-sniper | head -1)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Das Tag ${GITHUB_REF_NAME} passt nicht zur Zeile VERSION=\"${version}\" in bin/oracle-sniper. Bitte das Tag prüfen; die Nummer vergibt release.yml beim Merge."
              exit 1
            fi
            primary="${IMAGE}:${version}"
            tags="${IMAGE}:latest,${primary}"
          else
            primary="${IMAGE}:${BRANCH_IMAGE_TAG}"
            tags="${primary}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "primary=${primary}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building: ${tags}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify both architectures
        env:
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: |
          set -euo pipefail
          echo "Published platforms:"
          docker buildx imagetools inspect "${PRIMARY}" \
            | grep -o 'linux/[a-z0-9]*' | sort -u | sed 's/^/  /'
          for want in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "${PRIMARY}" | grep -q "$want" \
              || { echo "MISSING: $want"; exit 1; }
          done
          echo "Both architectures present."

      - name: Smoke test
        env:
          PRIMARY: ${{ steps.meta.outputs.primary }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          reported="$(docker run --rm --entrypoint oracle-sniper "${PRIMARY}" version)"
          echo "$reported"
          if [ "$reported" != "oracle-sniper ${VERSION}" ]; then
            echo "::error::Das Image meldet \"${reported}\", erwartet war \"oracle-sniper ${VERSION}\". Bitte bin/oracle-sniper und den Release-Commit prüfen."
            exit 1
          fi
          docker run --rm --entrypoint sh "${PRIMARY}" -c \
            'for t in bash curl openssl flock base64; do command -v $t >/dev/null || { echo "missing: $t"; exit 1; }; done; echo "all tools present"'

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "docker pull ${{ steps.meta.outputs.primary }}"
            echo '```'
            echo
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
